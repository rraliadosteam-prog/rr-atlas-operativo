.node {

  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  border: 2px solid;
  min-width: 140px;
  max-width: 200px;

}

header { position: fixed; top: 0; left: 0; right: 0; background: #070001; border-bottom: 2px solid #BE076D; padding: 12px 20px; z-index: 1000; display: flex; align-items: center; gap: 16px; }
header h1 { font-size: 16px; }
header span { color: #BE076D; font-size: 12px; }
#info { position: fixed; bottom: 20px; right: 20px; background: #1a1a1a; padding: 16px; border-radius: 8px; border: 1px solid #333; max-width: 300px; display: none; z-index: 1000; }
#info.show { display: block; }
#info h3 { margin-bottom: 8px; color: #BE076D; }
#info p { font-size: 12px; line-height: 1.5; margin-bottom: 4px; }

const canvas = document.getElementById('canvas');
const info = document.getElementById('info');

RR_GRAPH.data.forEach(node => {
  const el = document.createElement('div');
  el.className = `node ${node.type}`;
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
  el.innerHTML = `
    <div class="type">${node.type}</div>
    <div class="title">${node.title}</div>
    <span class="status" style="background:${node.type === 'Gobierno' ? '#fff3' : '#0003'}">${node.status}</span>
  `;
  el.onclick = () => {
    document.getElementById('info-title').textContent = node.title;
    document.getElementById('info-type').textContent = 'Tipo: ' + node.type;
    document.getElementById('info-status').textContent = 'Estado: ' + node.status;
    document.getElementById('info-owner').textContent = 'Responsable: ' + node.owner;
    document.getElementById('info-desc').textContent = node.desc || node.notes || '';
    info.classList.add('show');
  };
  canvas.appendChild(el);
});

document.onclick = (e) => {
  if (!e.target.closest('.node') && !e.target.closest('#info')) {
    info.classList.remove('show');
  }
};
